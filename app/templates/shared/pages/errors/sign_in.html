{% extends "shared/components/base.html" %}

{% block pageTitle %}
Sign-in could not be completed
{% endblock %}

{% block content %}
<div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
        <h1 class="govuk-heading-xl">Sign-in could not be completed</h1>
        <p class="govuk-body">{{ error_message }}</p>
        <p class="govuk-body"><a class="govuk-link" href="{{ url_for('auth_routes.login') }}">Try signing in again</a></p>
    </div>
</div>
{% endblock %}
