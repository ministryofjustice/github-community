[project]
name = "github-community"
version = "1.0.0"
description = "Passionate engineers delivering great services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.20.1",
  "authlib==1.9.1",
  "flask==3.1.3",
  "flask-cors==6.0.5",
  "flask-limiter==4.1.1",
  "flask-sqlalchemy==3.1.1",
  "govuk-frontend-jinja==4.1.0",
  "gunicorn==26.2.0",
  "openpyxl==3.1.5",
  "psycopg2-binary==2.9.13",
  "pygithub==2.10.0",
  "pynacl==1.6.2",
  "sentry-sdk==2.73.0",
  "urllib3==2.8.0",
  "werkzeug==3.1.9",
]

[dependency-groups]
dev = [
  "coverage==7.17.0",
  "pre-commit==4.7.0",
  "pytest==9.2.0",
  "ruff==0.17.3",
  "zizmor==1.31.1",
]

[tool.sqlfluff.core]
dialect = "postgres"

