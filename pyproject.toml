[project]
name = "github-community"
version = "1.0.0"
description = "Passionate engineers delivering great services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.18.5",
  "authlib==1.7.2",
  "flask==3.1.3",
  "flask-cors==6.0.5",
  "flask-limiter==4.1.1",
  "flask-sqlalchemy==3.1.1",
  "govuk-frontend-jinja==4.1.0",
  "gunicorn==26.0.0",
  "psycopg2-binary==2.9.12",
  "pygithub==2.9.1",
  "pynacl==1.6.2",
  "sentry-sdk==2.66.1",
  "urllib3==2.7.0",
  "werkzeug==3.1.8",
]

[dependency-groups]
dev = [
  "coverage==7.15.2",
  "pre-commit==4.6.1",
  "pytest==9.1.1",
  "ruff==0.16.0",
  "zizmor==1.28.0",
]

[tool.sqlfluff.core]
dialect = "postgres"

