---
name: ♻️ Tests

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false

      - name: Set Up UV
        id: setup_uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          activate-environment: true

      - name: Sync Dependencies
        id: sync_dependencies
        run: make uv-sync

      - name: Run Tests
        id: run_tests
        run: make test

      - name: Test Archived Pagination
        run: node --test test/test_app/test_static/test_archived_filters.js
