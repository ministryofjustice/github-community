app:
  ingress:
    hosts:
      - "github-community.cloud-platform.service.justice.gov.uk"
      - "github-community.service.justice.gov.uk"
      - "operations-engineering-reports.cloud-platform.service.justice.gov.uk"
      - "operations-engineering-reports-prod.cloud-platform.service.justice.gov.uk"
    modsec:
      githubTeam: "github-community"
      ingressName: "modsec"

  deployment:
    replicaCount: 1
    env:
      AUTH0_DOMAIN: "github-community.eu.auth0.com"
      SENTRY_ENV: "production"
      FLASK_DEBUG: true
      PHASE_BANNER_TEXT: "ALPHA"
      AUTH_ENABLED: true
      GITHUB_STATS_ACCESS_TEAM: "ministryofjustice/repository-stats-viewers"

  jobs:
    map_github_repositories_to_owners:
      schedule: "0 5,10,15 * * *"
      workers: 3
      repository_visibility: all
      repository_limit: 10000
      active_deadline_seconds: 14400
    # Repository Stats visibility snapshot (UTC)
    record_repository_visibility:
      schedule: "0 4,13 * * *"
