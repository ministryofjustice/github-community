apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.deployment.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      # serviceAccountName created by the Cloud Platform environment
      serviceAccountName: cd-serviceaccount
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.app.deployment.image.repository }}:{{ .Values.app.deployment.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: AUTH0_DOMAIN
              value: {{ .Values.app.deployment.env.AUTH0_DOMAIN | quote }}
            - name: AUTH0_CLIENT_ID
              value: {{ .Values.app.deployment.env.AUTH0_CLIENT_ID | quote }}
            - name: AUTH0_CLIENT_SECRET
              value: {{ .Values.app.deployment.env.AUTH0_CLIENT_SECRET | quote }}
            - name: APP_SECRET_KEY
              value: {{ .Values.app.deployment.env.APP_SECRET_KEY | quote }}
            - name: FLASK_DEBUG
              value: {{ .Values.app.deployment.env.FLASK_DEBUG | quote }}
            - name: PHASE_BANNER_TEXT
              value: {{ .Values.app.deployment.env.PHASE_BANNER_TEXT }}
            - name: POSTGRES_USER
              value: {{ .Values.app.deployment.env.POSTGRES_USER | quote }}
            - name: POSTGRES_PASSWORD
              value:
                {{ .Values.app.deployment.env.POSTGRES_PASSWORD | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.app.deployment.env.POSTGRES_DB | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.app.deployment.env.POSTGRES_HOST | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.app.deployment.env.POSTGRES_PORT | quote }}
            - name: CIRCLECI_COST_PER_CREDIT
              value: {{ .Values.app.deployment.env.CIRCLECI_COST_PER_CREDIT | quote }}
            - name: CIRCLECI_TOKEN
              value: {{ .Values.app.deployment.env.CIRCLECI_TOKEN | quote }}
            - name: GITHUB_APP_CLIENT_ID
              value: {{ .Values.app.deployment.env.GITHUB_APP_CLIENT_ID | quote }}
            - name: GITHUB_APP_PRIVATE_KEY
              value: {{ .Values.app.deployment.env.GITHUB_APP_PRIVATE_KEY | quote }}
            - name: GITHUB_APP_INSTALLATION_ID
              value: {{ .Values.app.deployment.env.GITHUB_APP_INSTALLATION_ID | quote }}
            - name: SENTRY_DSN_KEY
              value: {{ .Values.app.deployment.env.SENTRY_DSN_KEY | quote }}
            - name: SENTRY_ENV
              value: {{ .Values.app.deployment.env.SENTRY_ENV | quote }}
            {{- with .Values.app.deployment.env.GITHUB_STATS_ACCESS_TEAM }}
            - name: GITHUB_STATS_ACCESS_TEAM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.app.deployment.env.GITHUB_STATS_OAUTH_CLIENT_ID }}
            - name: GITHUB_STATS_OAUTH_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.app.deployment.env.GITHUB_STATS_OAUTH_CLIENT_SECRET }}
            - name: GITHUB_STATS_OAUTH_CLIENT_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- $reconcile := dig "flow_metrics_reconcile" "enabled" false .Values.app.jobs }}
            {{- if $reconcile }}
            - name: FLOW_METRICS_ENABLED
              value: "true"
            {{- else }}
            {{- with .Values.app.deployment.env.FLOW_METRICS_ENABLED }}
            - name: FLOW_METRICS_ENABLED
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.app.deployment.env.FLOW_METRICS_DATA_MODE }}
            - name: FLOW_METRICS_DATA_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.app.deployment.env.FLOW_METRICS_WORKSPACE_NAME }}
            - name: FLOW_METRICS_WORKSPACE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.app.deployment.env.FLOW_METRICS_SOURCE_URL }}
            - name: FLOW_METRICS_SOURCE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if dig "flowMetrics" "webhook" "enabled" false .Values.app }}
            {{- include "app.flowMetrics.devOnly" . }}
            {{- $webhook := .Values.app.flowMetrics.webhook }}
            {{- if or (not (regexMatch "^[1-9][0-9]*$" (toString $webhook.organisationId))) (not (regexMatch "^[1-9][0-9]*$" (toString $webhook.installationId))) }}
            {{- fail "Flow Metrics webhook requires verified positive organisationId and installationId" }}
            {{- end }}
            - name: FLOW_METRICS_WEBHOOK_ENABLED
              value: "true"
            - name: FLOW_METRICS_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "Flow Metrics webhook secretName is required" $webhook.secretName | quote }}
                  key: secret
            - name: FLOW_METRICS_WEBHOOK_ORGANISATION_ID
              value: {{ $webhook.organisationId | quote }}
            - name: FLOW_METRICS_WEBHOOK_INSTALLATION_ID
              value: {{ $webhook.installationId | quote }}
            {{- end }}

          ports:
            - name: http
              containerPort: 80
